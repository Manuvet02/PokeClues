name: Generate daily shiny puzzle

on:
  schedule:
    # GitHub cron is UTC; run checks at both UTC hours that can be midnight in Rome.
    - cron: "0 22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shiny-puzzle
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Rome local time
        id: schedule
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Rome date +%H)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$local_hour" == "00" ]]; then
            echo "should_generate=true" >> "$GITHUB_OUTPUT"
            echo "puzzle_date=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "should_generate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate puzzle
        if: steps.schedule.outputs.should_generate == 'true'
        run: python scripts/generate_shiny_puzzle.py --date "${{ steps.schedule.outputs.puzzle_date }}"

      - name: Commit puzzle
        if: steps.schedule.outputs.should_generate == 'true'
        shell: bash
        env:
          PUZZLE_DATE: ${{ steps.schedule.outputs.puzzle_date }}
        run: |
          git add "puzzles/shiny-${PUZZLE_DATE}.json"
          if git diff --cached --quiet; then
            echo "No puzzle changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate shiny puzzle for ${PUZZLE_DATE}"
          git push

name: Generate daily shiny puzzle

on:
  schedule:
    - cron: "17 0 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-shiny-puzzle
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set puzzle date in Rome timezone
        id: schedule
        run: |
          echo "puzzle_date=$(TZ=Europe/Rome date +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate puzzle
        run: python scripts/generate_shiny_puzzle.py --date "${{ steps.schedule.outputs.puzzle_date }}"

      - name: Commit puzzle
        shell: bash
        env:
          PUZZLE_DATE: ${{ steps.schedule.outputs.puzzle_date }}
        run: |
          git add "puzzles/shiny-${PUZZLE_DATE}.json"
          if git diff --cached --quiet; then
            echo "No puzzle changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate shiny puzzle for ${PUZZLE_DATE}"
          git push

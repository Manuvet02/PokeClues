<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pokémon Clues - Un puzzle game ispirato a Clues by Sam con Pokémon. Posiziona i Pokémon nella griglia seguendo gli indizi!"
    />
    <title>Pokémon Clues</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient glow effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <main id="main-content">
      <!-- Grid Section -->
      <section id="grid-section">
        <div class="grid-header">
          <div class="grid-title-group">
            <h2>Puzzle Grid</h2>
            <div class="grid-stats">
              <span
                id="correct-count-badge"
                class="stat-badge"
                title="Pokémon posizionati correttamente"
              >
                <span class="stat-icon">✓</span>
                <span id="correct-count-text">0 / 20</span>
              </span>
              <span
                id="game-timer"
                class="stat-badge timer-badge"
                title="Tempo trascorso"
              >
                ⏱️ 00:00
              </span>
            </div>
          </div>
          <div class="grid-controls">
            <button
              id="btn-sound"
              class="control-btn"
              title="Attiva/Disattiva audio"
            >
              <span id="sound-icon">🔊</span>
            </button>
            <button id="btn-clear" class="control-btn" title="Svuota griglia">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
                />
              </svg>
              Svuota
            </button>
            <button id="btn-shuffle" class="control-btn" title="Rimescola pool">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <polyline points="16 3 21 3 21 8" />
                <line x1="4" y1="20" x2="21" y2="3" />
                <polyline points="21 16 21 21 16 21" />
                <line x1="15" y1="15" x2="21" y2="21" />
                <line x1="4" y1="4" x2="9" y2="9" />
              </svg>
              Rimescola
            </button>
          </div>
        </div>
        <div id="puzzle-grid" class="puzzle-grid">
          <!-- 5 rows × 4 cols = 20 cells, generated by JS -->
        </div>
      </section>

      <!-- Clues Section (sidebar on desktop) -->
      <section id="clues-section">
        <div class="clues-header">
          <h2>📋 Indizi</h2>
          <span class="clue-count" id="clue-count">0 indizi</span>
        </div>
        <div id="clues-list" class="clues-list">
          <!-- Clues generated by JS -->
        </div>
      </section>
    </main>

    <!-- Pool Section -->
    <section id="pool-section">
      <div class="pool-header">
        <h2>🎒 Pool Pokémon</h2>
        <span class="pool-count" id="pool-count">0 disponibili</span>
      </div>
      <div id="sprite-pool" class="sprite-pool">
        <!-- Sprite items generated by JS -->
      </div>
    </section>

    <footer id="site-footer">
      <p>
        Pokémon Clues &mdash; Un puzzle game ispirato a
        <a href="https://cluesbysam.com/" target="_blank" rel="noopener"
          >Clues by Sam</a
        >
      </p>
    </footer>

    <!-- Floating Victory Banner (appears when puzzle is won) -->
    <button
      id="btn-show-victory"
      class="floating-victory-banner hidden"
      title="Riapri schermata vittoria"
    >
      🏆 Puzzle Completato! Clicca per vedere le statistiche
    </button>

    <!-- Victory Screen Modal -->
    <div
      id="victory-modal"
      class="modal-overlay hidden"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-backdrop"></div>
      <canvas id="confetti-canvas"></canvas>
      <div class="modal-card">
        <div class="modal-sparkles">✨</div>
        <div class="victory-trophy-wrapper">
          <div class="victory-pokeball">
            <div class="pokeball-top"></div>
            <div class="pokeball-line"></div>
            <div class="pokeball-center"></div>
          </div>
          <div class="victory-crown">👑</div>
        </div>
        <h2 class="victory-title">VITTORIA!</h2>
        <p class="victory-subtitle">
          Hai posizionato tutti i Pokémon al posto giusto!
        </p>

        <div class="victory-stats">
          <div class="stat-box">
            <span class="stat-label">Tempo</span>
            <span class="stat-value" id="victory-time">00:00</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Mosse</span>
            <span class="stat-value" id="victory-moves">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Correttezza</span>
            <span class="stat-value" id="victory-accuracy">20 / 20</span>
          </div>
        </div>

        <div class="victory-actions">
          <button id="btn-play-again" class="modal-btn btn-primary">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            Rigioca
          </button>
          <button id="btn-close-victory" class="modal-btn btn-secondary">
            Ammira la Griglia
          </button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pokémon Clues - A daily Pokémon logic puzzle inspired by Clues by Sam."
    />
    <title>Pokémon Clues</title>
    <link rel="icon" type="image/svg+xml" href="/web/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ambient glow effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <main id="main-content">
      <!-- Grid Section -->
      <section id="grid-section">
        <div class="grid-header">
          <div class="grid-title-group">
            <h2 data-i18n="gridTitle">Puzzle Grid</h2>
            <div class="grid-stats">
              <span
                id="correct-count-badge"
                class="stat-badge"
                title="Pokémon placed correctly"
                data-i18n-title="placedCorrectly"
              >
                <span class="stat-icon">✓</span>
                <span id="correct-count-text">0 / 20</span>
              </span>
              <span
                id="game-timer"
                class="stat-badge timer-badge"
                title="Elapsed time"
                data-i18n-title="timerElapsed"
              >
                ⏱️ 00:00
              </span>
            </div>
          </div>
          <div class="grid-controls">
            <label class="language-control">
              <span class="visually-hidden" data-i18n="language">Language</span>
              <select
                id="language-select"
                aria-label="Language"
                data-i18n-aria-label="language"
              >
                <option value="en">English</option>
                <option value="it">Italiano</option>
              </select>
            </label>
            <button
              id="btn-sound"
              class="control-btn"
              title="Toggle sound"
              data-i18n-title="toggleSound"
            >
              <span id="sound-icon">🔊</span>
            </button>
          </div>
        </div>
        <div id="puzzle-grid" class="puzzle-grid">
          <!-- 5 rows × 4 cols = 20 cells, generated by JS -->
        </div>
      </section>

      <!-- Clues Section (sidebar on desktop) -->
      <section id="clues-section">
        <div class="clues-header">
          <h2 data-i18n="cluesTitle">📋 Clues</h2>
          <span class="clue-count" id="clue-count">0 clues</span>
        </div>
        <div id="clues-list" class="clues-list">
          <!-- Clues generated by JS -->
        </div>
      </section>
    </main>

    <!-- Floating Victory Banner (appears when puzzle is won) -->
    <button
      id="btn-show-victory"
      class="floating-victory-banner hidden"
      title="Reopen victory screen"
      data-i18n-title="reopenVictory"
    >
      <span data-i18n="reopenBanner"
        >🏆 Puzzle Complete! Click to see your stats</span
      >
    </button>

    <!-- Victory Screen Modal -->
    <div
      id="victory-modal"
      class="modal-overlay hidden"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-backdrop"></div>
      <canvas id="confetti-canvas"></canvas>
      <div class="modal-card">
        <div class="modal-sparkles">✨</div>
        <div class="victory-trophy-wrapper">
          <div class="victory-pokeball">
            <div class="pokeball-top"></div>
            <div class="pokeball-line"></div>
            <div class="pokeball-center"></div>
          </div>
          <div class="victory-crown">👑</div>
        </div>
        <h2 class="victory-title" data-i18n="victory">VICTORY!</h2>
        <p class="victory-subtitle">
          <span data-i18n="victorySubtitle"
            >You placed every Pokémon correctly!</span
          >
        </p>

        <div class="victory-stats">
          <div class="stat-box">
            <span class="stat-label" data-i18n="time">Time</span>
            <span class="stat-value" id="victory-time">00:00</span>
          </div>
          <div class="stat-box">
            <span class="stat-label" data-i18n="moves">Moves</span>
            <span class="stat-value" id="victory-moves">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label" data-i18n="accuracy">Accuracy</span>
            <span class="stat-value" id="victory-accuracy">20 / 20</span>
          </div>
        </div>

        <div class="victory-actions">
          <button id="btn-play-again" class="modal-btn btn-primary">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span data-i18n="playAgain">Play Again</span>
          </button>
          <button id="btn-close-victory" class="modal-btn btn-secondary">
            <span data-i18n="viewGrid">View Grid</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/app.js"></script>
    <script src="scripts/i18n.js"></script>
  </body>
</html>
